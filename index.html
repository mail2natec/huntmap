<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RoCo Hunt">
<meta name="theme-color" content="#18201a">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>RoCo Hunt</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root{--bg:#18201a;--panel:#222c24;--line:#36443a;--text:#eef2ea;--muted:#a9b5a6;--accent:#ff8a1f;--green:#4cc463;--danger:#e5534b;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #map{position:absolute;inset:0}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .btn{background:#2f3b32;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:600}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1205}
  .btn.danger{background:transparent;border-color:var(--danger);color:#ff8f88}
  .btn.small{padding:6px 10px;font-size:13px}
  #topbar{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;display:flex;gap:8px;align-items:center;pointer-events:none;z-index:5}
  #topbar>*{pointer-events:auto}
  .chip{background:rgba(24,32,26,.88);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;backdrop-filter:blur(6px)}
  #title{font-weight:700}
  #syncChip{margin-left:auto}
  #title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
  #wxChip{display:none;align-items:center;gap:5px;padding:4px 10px 4px 4px;font-weight:700;white-space:nowrap;flex:0 0 auto}
  #wxChip small{font-size:10px;font-weight:600;color:var(--muted);margin-left:-2px}
  .wxArrow{width:22px;height:22px;border-radius:50%;background:#2c3a2e;display:inline-grid;place-items:center;flex:0 0 auto}
  .wxArrow.big{width:44px;height:44px}
  #topbar .chip{white-space:nowrap}
  #syncChip,#setupBtn{flex:0 0 auto}
  @media (max-width:370px){ #wxChip small{display:none} #topbar{gap:6px} #topbar .chip{padding-left:9px;padding-right:9px} #wxChip{padding:4px 9px 4px 4px} }
  .wxNow{display:flex;align-items:center;gap:12px;margin:4px 0 10px}
  .wxNow b{font-size:22px}
  .wxLegal{background:#2c3a2e;border-radius:12px;padding:10px 12px;margin:6px 0 10px}
  .wxLegal b{color:var(--accent)}
  .wxRow{display:grid;grid-template-columns:4.2em 1fr 3em 3em;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
  .wxRow span:nth-child(3),.wxRow span:nth-child(4){text-align:right}
  #hint{position:absolute;top:calc(env(safe-area-inset-top) + 52px);left:50%;transform:translateX(-50%);z-index:5;display:none;white-space:nowrap}
  #toolbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(94vw,460px);z-index:6;display:flex;justify-content:space-around;background:rgba(24,32,26,.94);border:1px solid var(--line);border-radius:20px;padding:6px 4px;box-shadow:0 4px 18px rgba(0,0,0,.45);backdrop-filter:blur(8px)}
  #toolbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:5px 6px;min-width:56px;border-radius:14px}
  #toolbar button span.i{font-size:21px;line-height:1}
  #toolbar button.on{color:var(--accent);background:rgba(255,138,31,.12)}
  #toolbar button.rec{color:#ff5a4f}
  .float{position:absolute;z-index:6;bottom:calc(env(safe-area-inset-bottom) + 84px)}
  #layersBtn{left:12px;display:flex;align-items:center;gap:8px;background:#f4f4ef;color:#1d231f;border-radius:14px;padding:8px 14px 8px 10px;font-weight:700;font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
  #layersBtn svg{width:22px;height:22px}
  #rightBtns{right:12px;display:flex;flex-direction:column;gap:8px}
  .fbtn{width:48px;height:48px;border-radius:50%;background:#f4f4ef;color:#1d231f;font-weight:800;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
  .fbtn.on{background:var(--accent);color:#1b1205}
  .fbtn svg{width:24px;height:24px}
  body.moding .float{display:none!important}
  .maplibregl-ctrl-group:has(.maplibregl-ctrl-geolocate){display:none}
  #actionbar{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:7;display:none;background:rgba(24,32,26,.96);border:1px solid var(--line);border-radius:14px;padding:10px;gap:8px;flex-wrap:wrap;align-items:center}
  #actionbar .msg{flex:1 1 100%;font-size:14px;color:var(--muted)}
  #actionbar .msg b{color:var(--text)}
  #crosshair{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;z-index:4;display:none;pointer-events:none}
  #crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff;box-shadow:0 0 0 1px #000}
  #crosshair:before{left:21px;top:0;width:2px;height:44px}
  #crosshair:after{top:21px;left:0;height:2px;width:44px}
  .sheet-wrap{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
  .sheet{width:100%;max-width:560px;max-height:86vh;overflow:auto;background:var(--panel);border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);border-top:1px solid var(--line)}
  .sheet h2{margin:0 0 12px;font-size:18px}
  .sheet h3{margin:18px 0 8px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input[type=text],input[type=password],textarea,select{width:100%;background:#151c17;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font:inherit}
  textarea{min-height:80px;resize:vertical}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .row>.btn{flex:1}
  .typegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .typegrid button{background:#151c17;border:1px solid var(--line);border-radius:10px;padding:8px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
  .typegrid button .e{font-size:22px}
  .typegrid button.sel{border-color:var(--accent);background:#3a2c18}
  .toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
  .toggle input{width:22px;height:22px}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{flex:1;padding:9px 4px;font-size:13px}
  .seg button.sel{background:var(--accent);color:#1b1205;font-weight:700}
  .list-item{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
  .list-item .e{font-size:22px;width:30px;text-align:center}
  .list-item .t{flex:1;min-width:0}
  .list-item .t div:first-child{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list-item .t div:last-child{font-size:12px;color:var(--muted)}
  .muted{color:var(--muted);font-size:13px}
  .pin.priv{border-style:dashed;border-color:#ffd24a}
  .pin.priv::after{content:"🔒";position:absolute;right:-8px;top:-8px;font-size:12px}
  .pin{font-size:22px;line-height:30px;width:34px;height:34px;text-align:center;border-radius:50%;background:rgba(24,32,26,.9);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.6);cursor:pointer}
  .pin::before{content:"";position:absolute;inset:-7px;border-radius:50%}
  /* Pins shrink as you zoom out so they don't pile up */
  #map.zt-mid .pin{width:26px;height:26px;font-size:16px;line-height:22px}
  #map.zt-mid .pin.priv::after{font-size:10px;right:-7px;top:-7px}
  #map.zt-small .pin{width:18px;height:18px;font-size:11px;line-height:15px;border-width:1.5px}
  #map.zt-dot .pin{width:10px;height:10px;font-size:0;line-height:0;border-width:1.5px;background:#ff8a1f}
  #map.zt-small .pin.priv::after,#map.zt-dot .pin.priv::after{display:none}
  .maplibregl-popup-content{background:var(--panel);color:var(--text);border-radius:12px;padding:12px 14px;max-width:270px;box-shadow:0 4px 18px rgba(0,0,0,.5)}
  .maplibregl-popup-tip{border-top-color:var(--panel)!important;border-bottom-color:var(--panel)!important}
  .maplibregl-popup-close-button{color:var(--muted);font-size:20px;padding:2px 8px}
  .pop h4{margin:0 0 4px;font-size:15px;padding-right:18px}
  .pop .k{color:var(--muted);font-size:12px}
  .pop .sec{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
  .pop .note{white-space:pre-wrap;margin:6px 0;font-size:13px}
  .pop a{color:#8fd19e}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin-bottom:4px}
  .tag.pub{background:#1f5f2c;color:#c9f5d2}.tag.ours{background:#6a3a0c;color:#ffd9b0}.tag.priv{background:#5a4f12;color:#fff2a8}
  #toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 56px);transform:translateX(-50%);z-index:30;background:#0d120e;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:14px;display:none;max-width:90vw;text-align:center}
  .maplibregl-ctrl-top-right{top:calc(env(safe-area-inset-top) + 46px)}
  .maplibregl-ctrl-bottom-left{bottom:calc(env(safe-area-inset-bottom) + 136px)}
  .maplibregl-ctrl-bottom-right{bottom:calc(env(safe-area-inset-bottom) + 250px)}
  code{background:#151c17;padding:1px 5px;border-radius:5px;font-size:12px}
</style>
</head>
<body>
<div id="map"></div>
<div id="crosshair"></div>

<div id="topbar">
  <div class="chip" id="title">🦌 RoCo Hunt</div>
  <button class="chip" id="wxChip" aria-label="Weather"></button>
  <button class="chip" id="syncChip">Local only</button>
  <button class="chip" id="setupBtn" aria-label="Setup">⚙️</button>
</div>
<div class="chip" id="hint">Zoom in to see property lines</div>

<div id="actionbar"></div>

<div id="toolbar">
  <button data-tool="pin"><span class="i">📍</span>Pin</button>
  <button data-tool="line"><span class="i">〰️</span>Line</button>
  <button data-tool="track"><span class="i">👣</span>Track</button>
  <button data-tool="measure"><span class="i">📏</span>Measure</button>
  <button data-tool="marks"><span class="i">📋</span>Marks</button>
</div>
<button id="layersBtn" class="float"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5z" fill="#ff8a1f" stroke="#1d231f"/><path d="m2 12.5 10 5 10-5"/><path d="m2 17 10 5 10-5"/></svg>Layers</button>
<div id="rightBtns" class="float">
  <button class="fbtn" id="bmBtn" aria-label="Map type">Sat</button>
  <button class="fbtn" id="dBtn" aria-label="2D or 3D">2D</button>
  <button class="fbtn" id="locBtn" aria-label="My location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
</div>

<div class="sheet-wrap" id="sheetWrap"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
(() => {
"use strict";

/* ================= CONFIG ================= */
const CFG = {
  // Roanoke County public parcel service (owner names, acreage, address)
  parcelsLayer: "https://arcgis.roanokecountyva.gov/arcgisweb/rest/services/Published_Geodata/Parcel_Details/MapServer/1",
  // Virginia DWR Wildlife Management Area boundaries
  wmaLayer: "https://services.dwr.virginia.gov/arcgis/rest/services/HUB_Layers/DWR_WMA_Boundaries/FeatureServer/0",
  // Your hunting parcels are NOT stored in this file. They come from the family
  // setup link (or Setup screen) and are kept only on each phone.
  countyBounds: [[-80.27, 37.13], [-79.85, 37.46]],
  // generous box around Roanoke County + neighbors for public land
  regionBox: [-80.45, 37.05, -79.70, 37.55],
  parcelMinZoom: 13,
  syncEveryMs: 20000
};

const POINT_TYPES = [
  {id:"stand", e:"🪜", label:"Stand"},
  {id:"blind", e:"⛺", label:"Blind"},
  {id:"camera", e:"📷", label:"Trail cam"},
  {id:"scrape", e:"🟤", label:"Scrape"},
  {id:"rub", e:"🌳", label:"Rub"},
  {id:"bedding", e:"🛏️", label:"Bedding"},
  {id:"food", e:"🌾", label:"Food/plot"},
  {id:"water", e:"💧", label:"Water"},
  {id:"parking", e:"🚙", label:"Parking"},
  {id:"gate", e:"🚧", label:"Gate"},
  {id:"harvest", e:"⭐", label:"Harvest"},
  {id:"other", e:"📍", label:"Other"}
];
const LINE_TYPES = [
  {id:"logroad", e:"🟫", label:"Logging road", color:"#c08a4a", dash:false},
  {id:"gravel", e:"⬜", label:"Gravel road", color:"#ece6d6", dash:false},
  {id:"trail", e:"🦌", label:"Deer trail", color:"#ff9d2e", dash:true},
  {id:"access", e:"🥾", label:"Access route", color:"#3fd0ff", dash:true},
  {id:"boundary", e:"🚩", label:"Line/flagging", color:"#ff4fd8", dash:false},
  {id:"track", e:"👣", label:"GPS track", color:"#ffe14d", dash:true},
  {id:"lineother", e:"〰️", label:"Other", color:"#ffffff", dash:false}
];
const ROAD_TYPES = ["logroad", "gravel"];
const roadShown = m => !(m.type === "logroad" && settings.showLogRoads === false) && !(m.type === "gravel" && settings.showGravel === false);
const typeInfo = id => POINT_TYPES.find(t=>t.id===id) || LINE_TYPES.find(t=>t.id===id) || POINT_TYPES[POINT_TYPES.length-1];

/* ================= STORAGE ================= */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let marks = LS.get("hm_marks", {});
let settings = Object.assign({name:"", url:"", key:"", parcels:[], homeBounds:null, basemap:"sat", showParcels:true, showWma:true, showOurs:true, showLogRoads:true, showGravel:true, showRoadNames:true}, LS.get("hm_settings", {}));
const ourParcels = () => settings.parcels || [];
let dirty = new Set(LS.get("hm_dirty", []));
let track = LS.get("hm_track", null);   // in-progress GPS track {pts:[[lng,lat]...], start}
let lastSync = 0, syncError = "";
const saveMarks = () => LS.set("hm_marks", marks);
// Private marks live in their own store on this phone and are never uploaded.
let privateMarks = LS.get("hm_private", {});
const savePrivate = () => LS.set("hm_private", privateMarks);
const getMark = id => marks[id] || privateMarks[id];
// Sign-in session for family sharing (email + 6-digit code).
let auth = LS.get("hm_auth", null);
const saveAuth = () => LS.set("hm_auth", auth);
const saveSettings = () => LS.set("hm_settings", settings);
const saveDirty = () => LS.set("hm_dirty", [...dirty]);

/* ---------- Hunting groups ----------
   Each group (its own map, sync project and member list) keeps its data apart on this phone.
   The live hm_* keys always hold the active group; other groups are stored whole under hm_g_<id>. */
const GROUP_FIELDS = ["url","key","parcels","homeBounds","linkSentTo"];
let groups = LS.get("hm_groups", null);
if (!groups){ groups = {active:"g1", list:{g1:{label:"Group 1"}}}; LS.set("hm_groups", groups); }
const saveGroups = () => LS.set("hm_groups", groups);
const groupCount = () => Object.keys(groups.list).length;
const activeGroup = () => groups.list[groups.active] || {label:"Group 1"};
function snapshotActive(){
  const st = {}; GROUP_FIELDS.forEach(f => st[f] = settings[f]);
  return {settings:st, marks, dirty:[...dirty], private:privateMarks, auth, ours:LS.get("hm_cache_ours", null)};
}
function loadIntoLive(g){
  g = g || {};
  const st = g.settings || {};
  GROUP_FIELDS.forEach(f => settings[f] = st[f] !== undefined ? st[f] : (f === "parcels" ? [] : f === "homeBounds" ? null : ""));
  marks = g.marks || {}; dirty = new Set(g.dirty || []); privateMarks = g.private || {}; auth = g.auth || null;
  saveSettings(); saveMarks(); saveDirty(); savePrivate(); saveAuth();
  if (g.ours) LS.set("hm_cache_ours", g.ours); else localStorage.removeItem("hm_cache_ours");
}
// Swap the live data to another group (or a brand-new empty one when id is new)
function activateGroup(id, label){
  if (id === groups.active) return;
  LS.set("hm_g_" + groups.active, snapshotActive());
  loadIntoLive(LS.get("hm_g_" + id, null));
  localStorage.removeItem("hm_g_" + id);
  if (!groups.list[id]) groups.list[id] = {label: label || ("Group " + (groupCount() + 1))};
  groups.active = id; saveGroups();
}
const normUrl = u => String(u || "").replace(/\/+$/,"");
// Which sync project issued a sign-in token (its "iss" claim), e.g. https://xxxx.supabase.co
function tokenUrl(t){
  try { return normUrl((JSON.parse(decodeURIComponent(escape(atob(t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))))).iss || "").replace(/\/auth\/v1\/?$/,"")); }
  catch(e){ return ""; }
}
function groupIdForUrl(url){
  for (const id of Object.keys(groups.list)){
    const u = id === groups.active ? settings.url : ((LS.get("hm_g_" + id, {}) || {}).settings || {}).url;
    if (u && normUrl(u) === normUrl(url)) return id;
  }
  return null;
}

// Family setup link: #setup=<base64 json>  {p:[parcels], u:url, k:key, n:group name}
(function readSetupLink(){
  const m = location.hash.match(/^#setup=(.+)$/);
  if (!m) return;
  try {
    const cfg = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
    let msg = [];
    // A link for a different sync project = a different group: never mix its data with this one
    const target = cfg.u || cfg.iu;
    if (target && settings.url && normUrl(target) !== normUrl(settings.url)){
      const existing = groupIdForUrl(target);
      if (!existing && !cfg.u) throw new Error("unknown group");
      activateGroup(existing || ("g" + Date.now().toString(36)), cfg.n);
      msg.push(existing ? "switched to " + activeGroup().label : "added group " + activeGroup().label);
    }
    if (cfg.n && groupCount() === 1){ activeGroup().label = String(cfg.n).slice(0,40); saveGroups(); }
    if (cfg.u && cfg.k){ settings.url = cfg.u; settings.key = cfg.k; msg.push("family sync connected"); }
    if (Array.isArray(cfg.p) && cfg.p.length){ settings.parcels = cfg.p.map(String); settings.homeBounds = null; msg.push("hunting land added"); }
    // Sign-in handed over from Safari (iPhone home-screen app); it refreshes itself on first use
    if (cfg.r && settings.url && settings.key){
      auth = {access_token:"", refresh_token:String(cfg.r), expires_at:0, email:String(cfg.e || "")}; saveAuth();
      if (!settings.name && auth.email) settings.name = auth.email.split("@")[0];
      settings.linkSentTo = ""; msg.push("signed in" + (auth.email ? " as " + auth.email : ""));
    }
    saveSettings();
    if (msg.length) setTimeout(()=>toast("Setup done: " + msg.join(" & ") + " ✔", 3500), 800);
  } catch(e){ setTimeout(()=>toast("That setup link didn't work"), 800); }
  history.replaceState(null, "", location.pathname + location.search);
})();
// A sign-in saved under the wrong group (e.g. an email link tapped while another group was open):
// hand it to the group it belongs to, and never use it here.
(function fixMisfiledSignIn(){
  if (!auth || !auth.access_token || !settings.url) return;
  const u = tokenUrl(auth.access_token);
  if (!u || u === normUrl(settings.url)) return;
  const id = groupIdForUrl(u);
  if (id && id !== groups.active){ const g = LS.get("hm_g_" + id, {}) || {}; if (!g.auth){ g.auth = auth; LS.set("hm_g_" + id, g); } }
  auth = null; saveAuth();
})();
// A setup link opened in a tab that already had the app open only changes the hash: reload to apply it.
window.addEventListener("hashchange", () => { if (/^#setup=|[#&](access_token|error)=/.test(location.hash)) location.reload(); });

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const IS_STANDALONE = navigator.standalone === true || !!(window.matchMedia && matchMedia("(display-mode: standalone)").matches);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "m" + Date.now().toString(36) + Math.random().toString(36).slice(2));
if (groupCount() > 1) $("#title").textContent = "🦌 " + activeGroup().label;
function toast(msg, ms=2600){ const t=$("#toast"); t.textContent=msg; t.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display="none", ms); }
function haversine(a, b){ const R=6371008.8, r=Math.PI/180; const dLat=(b[1]-a[1])*r, dLon=(b[0]-a[0])*r; const x=Math.sin(dLat/2)**2+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function pathLen(c){ let d=0; for(let i=1;i<c.length;i++) d+=haversine(c[i-1],c[i]); return d; }
function fmtDist(m){ const yd=m*1.09361; if (yd < 440) return Math.round(yd)+" yd ("+Math.round(m*3.28084)+" ft)"; return (m/1609.344).toFixed(2)+" mi"; }
function fmtDate(ms){ try{ return new Date(ms).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); }catch(e){ return ""; } }
function bearing(a,b){ const r=Math.PI/180; const y=Math.sin((b[0]-a[0])*r)*Math.cos(b[1]*r); const x=Math.cos(a[1]*r)*Math.sin(b[1]*r)-Math.sin(a[1]*r)*Math.cos(b[1]*r)*Math.cos((b[0]-a[0])*r); const deg=(Math.atan2(y,x)/r+360)%360; const dirs=["N","NE","E","SE","S","SW","W","NW"]; return dirs[Math.round(deg/45)%8]; }
async function getJSON(url){ const r = await fetch(url); if(!r.ok) throw new Error("HTTP "+r.status); const j = await r.json(); if (j && j.error) throw new Error(j.error.message || "server error"); return j; }
function arcQuery(layerUrl, params){ return layerUrl + "/query?" + new URLSearchParams(Object.assign({f:"geojson", outSR:"4326"}, params)).toString(); }

// Fetch with a time limit and automatic retries, for spotty signal in the field.
async function getJSONRetry(url, tries = 3){
  let last;
  for (let i = 0; i < tries; i++){
    try {
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 15000);
      const r = await fetch(url, {signal: ctl.signal}); clearTimeout(t);
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json(); if (j && j.error) throw new Error(j.error.message || "server error");
      return j;
    } catch(e){ last = e; if (i < tries - 1) await new Promise(res => setTimeout(res, [2000, 5000][i] || 5000)); }
  }
  throw last;
}
// Copies kept on this phone so layers still show if a server is down. Parcels are never stored on GitHub.
const CACHE = {parcels:"hm_cache_parcels", ours:"hm_cache_ours", wma:"hm_cache_wma"};
const MAX_CACHED_PARCELS = 700;

const parcelCache = new Map(LS.get(CACHE.parcels, []).map(f => [f.properties.ParcelID, f]));
let parcelReq = 0;
function saveParcelCache(){
  clearTimeout(saveParcelCache._t);
  saveParcelCache._t = setTimeout(() => {
    const feats = [...parcelCache.values()].slice(-MAX_CACHED_PARCELS);   // newest last
    try { localStorage.setItem(CACHE.parcels, JSON.stringify(feats)); }
    catch(e){ try { localStorage.setItem(CACHE.parcels, JSON.stringify(feats.slice(-200))); } catch(e2){} }
  }, 1500);
}
function showParcels(){ if (map.getSource("parcels")) map.getSource("parcels").setData({type:"FeatureCollection", features:[...parcelCache.values()]}); }
async function loadParcels(){
  if (!map.getSource("parcels")) return;
  const hint = $("#hint");
  if (!settings.showParcels){ hint.style.display="none"; return; }
  if (map.getZoom() < CFG.parcelMinZoom){ hint.textContent="Zoom in to see property lines"; hint.style.display="block"; return; }
  hint.style.display = "none";
  showParcels();   // show saved copy right away
  const b = map.getBounds();
  const env = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].map(v=>v.toFixed(5)).join(",");
  const my = ++parcelReq;
  try {
    const j = await getJSONRetry(arcQuery(CFG.parcelsLayer, {
      where:"1=1", geometry:env, geometryType:"esriGeometryEnvelope", inSR:"4326", spatialRel:"esriSpatialRelIntersects",
      outFields:"ParcelID,Owner1_2LastFirst,Calc_Acreage,Full_Address_String,LegalDescription", returnGeometry:"true",
      geometryPrecision:"6", resultRecordCount:"2000"
    }), 2);
    if (my !== parcelReq) return;
    if (parcelCache.size > 8000) parcelCache.clear();
    (j.features||[]).forEach(f => { const id=f.properties && f.properties.ParcelID; if(id){ parcelCache.delete(id); parcelCache.set(id, f); } });
    showParcels(); saveParcelCache();
    if (j.exceededTransferLimit || (j.properties && j.properties.exceededTransferLimit)){ hint.textContent="Zoom in more to load every parcel"; hint.style.display="block"; }
  } catch(e){
    if (my === parcelReq){ hint.textContent = parcelCache.size ? "County server not responding — showing saved lines" : "Couldn't reach county parcel server"; hint.style.display="block"; }
    console.warn("parcels", e);
  }
}
function boundsOf(fc){
  let b = null;
  const walk = c => { if (typeof c[0] === "number"){ b ? b.extend(c) : (b = new maplibregl.LngLatBounds(c, c)); } else c.forEach(walk); };
  (fc.features||[]).forEach(f => f.geometry && walk(f.geometry.coordinates));
  return b;
}
async function loadOurs(flyHome){
  const src = map.getSource("ours"); if (!src) return;
  const ids = ourParcels().filter(p => /^[\w.\-]+$/.test(p));
  if (!ids.length){ src.setData(EMPTY); return; }
  const cached = LS.get(CACHE.ours, null);
  const cachedOk = cached && cached.key === ids.join("|");
  if (cachedOk) src.setData(cached.data);   // show saved outline right away
  try {
    const where = "ParcelID IN (" + ids.map(p=>"'"+p+"'").join(",") + ")";
    const j = await getJSONRetry(arcQuery(CFG.parcelsLayer, {where, outFields:"ParcelID,Owner1_2LastFirst,Calc_Acreage,Full_Address_String,LegalDescription", returnGeometry:"true", geometryPrecision:"6"}));
    src.setData(j);
    LS.set(CACHE.ours, {key: ids.join("|"), data: j});
    const b = boundsOf(j);
    if (b){
      const nb = b.toArray();
      const first = !settings.homeBounds;
      settings.homeBounds = nb; saveSettings();
      if (first || flyHome) map.fitBounds(nb, {padding:40});
    }
  } catch(e){
    console.warn("ours", e);
    if (!cachedOk) toast("Couldn't load the hunting land outline (county server)");
  }
}
function goHome(){
  if (settings.homeBounds) map.fitBounds(settings.homeBounds, {padding:40});
  else if (ourParcels().length) loadOurs(true);
  else { map.fitBounds(CFG.countyBounds, {padding:20}); toast("Add your parcels in Setup to set a home view"); }
}
async function loadWma(){
  const src = map.getSource("wma");
  const cached = LS.get(CACHE.wma, null);
  if (cached) src.setData(cached);   // show saved boundaries right away
  try {
    const j = await getJSONRetry(arcQuery(CFG.wmaLayer, {
      where:"1=1", geometry:CFG.regionBox.join(","), geometryType:"esriGeometryEnvelope", inSR:"4326", spatialRel:"esriSpatialRelIntersects",
      outFields:"WMA_NAME,ACRES,URL,Property_Type", returnGeometry:"true", geometryPrecision:"6"
    }));
    if (!(j.features||[]).length) throw new Error("no WMAs returned");
    src.setData(j);
    try { localStorage.setItem(CACHE.wma, JSON.stringify(j)); } catch(e){}
  } catch(e){
    console.warn("wma live", e);
    if (cached) return;
    try { const j = await getJSONRetry("wma.json", 2); src.setData(j); }   // backup copy stored with the app
    catch(e2){ console.warn("wma backup", e2); toast("Couldn't load WMA boundaries (DWR server)"); }
  }
}

let domMarkers = [];
function liveMarks(){ return Object.values(marks).filter(m => !m.deleted).concat(Object.values(privateMarks)); }
function renderMarks(){
  domMarkers.forEach(m => m.remove()); domMarkers = [];
  const lines = [];
  liveMarks().forEach(m => {
    if (m.kind === "point"){
      const el = document.createElement("div");
      el.className = "pin" + (m.private ? " priv" : ""); el.textContent = typeInfo(m.type).e; el.title = m.name || typeInfo(m.type).label;
      el.addEventListener("click", ev => { ev.stopPropagation(); if (mode) return; showMarkPopup(m.id, m.coords); });
      domMarkers.push(new maplibregl.Marker({element:el}).setLngLat(m.coords).addTo(map));
    } else if (m.kind === "line" && m.coords && m.coords.length > 1 && roadShown(m)){
      lines.push({type:"Feature", properties:{id:m.id, type:m.type, name:m.name || "", draft:!!m.draft && ROAD_TYPES.includes(m.type)}, geometry:{type:"LineString", coordinates:m.coords}});
    }
  });
  if (map.getSource("lines")) map.getSource("lines").setData({type:"FeatureCollection", features:lines});
}
// Pin size tier by zoom: full ≥16, medium 15–16, small 13.5–15, dot below 13.5
let zoomTier = "";
function updateZoomTier(){
  const z = map.getZoom();
  const t = z >= 16 ? "" : z >= 15 ? "zt-mid" : z >= 13.5 ? "zt-small" : "zt-dot";
  if (t === zoomTier) return;
  const c = map.getContainer().classList;
  if (zoomTier) c.remove(zoomTier);
  if (t) c.add(t);
  zoomTier = t;
}
map.on("zoom", updateZoomTier); updateZoomTier();
function upsertMark(m){
  m.updated = Date.now();
  if (!m.by) m.by = settings.name || "";
  if (m.private){
    if (marks[m.id] && !marks[m.id].deleted){
      // Was shared: remove the shared copy for everyone, keep a private copy under a new id.
      marks[m.id] = {id:m.id, kind:m.kind, deleted:true, updated:m.updated};
      dirty.add(m.id); saveMarks(); saveDirty(); syncSoon();
      m = Object.assign({}, m, {id: uid()});
    }
    privateMarks[m.id] = m; savePrivate();
  } else {
    if (privateMarks[m.id]){ delete privateMarks[m.id]; savePrivate(); }
    delete m.private;
    marks[m.id] = m; dirty.add(m.id);
    saveMarks(); saveDirty(); syncSoon();
  }
  renderMarks();
}
function deleteMark(id){
  if (privateMarks[id]){ delete privateMarks[id]; savePrivate(); renderMarks(); return; }
  const m = marks[id]; if (!m) return;
  marks[id] = {id, kind:m.kind, deleted:true, updated:Date.now()};
  dirty.add(id); saveMarks(); saveDirty(); renderMarks(); syncSoon();
}

let popup = null;
function setSelection(feature){ const s = map.getSource("sel"); if (s) s.setData(feature ? {type:"FeatureCollection", features:[feature]} : EMPTY); }
// The parcel highlight lives only as long as its pop-up: closing the pop-up clears it.
function openPopup(lngLat, html, selFeature){
  if (popup) popup.remove();
  setSelection(selFeature || null);
  const p = new maplibregl.Popup({maxWidth:"290px", closeOnClick:true, focusAfterOpen:false}).setLngLat(lngLat).setHTML(html);
  p.on("close", () => { if (popup === p){ popup = null; setSelection(null); } });
  popup = p.addTo(map);
}
function showMarkPopup(id, lngLat){
  const m = getMark(id); if (!m) return;
  const t = typeInfo(m.type);
  let extra = "";
  if (m.kind === "line") extra = `<div class="k">Length: ${fmtDist(pathLen(m.coords))}</div>`;
  if (m.kind === "point" && myPos){ const d = haversine(myPos, m.coords); extra = `<div class="k">From you: ${fmtDist(d)} ${bearing(myPos, m.coords)}</div>`; }
  const coordTxt = m.kind==="point" ? `<div class="k">${m.coords[1].toFixed(5)}, ${m.coords[0].toFixed(5)}</div>` : "";
  openPopup(lngLat, `<div class="pop"><h4>${t.e} ${esc(m.name || t.label)}</h4>
    ${m.private ? `<div class="k">🔒 Private — only on this phone</div>` : ""}<div class="k">${esc(t.label)}${m.draft && ROAD_TYPES.includes(m.type) ? " · ✏️ Draft" : ""}${m.by && !m.private ? " · added by "+esc(m.by) : ""}${m.created ? " · "+fmtDate(m.created) : ""}</div>
    ${m.notes ? `<div class="note">${esc(m.notes)}</div>` : ""}${extra}${coordTxt}
    <div class="row" style="margin-top:10px"><button class="btn small" data-act="edit" data-id="${esc(id)}">Edit</button></div></div>`);
}

/* ---------- map clicks ---------- */
map.on("click", e => {
  const ll = [e.lngLat.lng, e.lngLat.lat];
  if (mode === "line" || mode === "measure"){ draft.push(ll); updateDraft(); return; }
  if (mode === "extend" && extendTarget){
    if (!draft.length){   // first tap decides which end to grow from
      const c = extendTarget.coords;
      extendAtStart = haversine(ll, c[0]) < haversine(ll, c[c.length - 1]);
    }
    draft.push(ll); updateDraft(); return;
  }
  if (mode === "pin" || mode === "track") return;
  const lineHit = map.queryRenderedFeatures(e.point, {layers:["lines-hit"]})[0];
  if (lineHit){ showMarkPopup(lineHit.properties.id, e.lngLat); return; }
  const layers = ["wma-fill","ours-fill","parcels-fill"].filter(l => map.getLayer(l) && map.getLayoutProperty(l,"visibility") !== "none");
  const hits = map.queryRenderedFeatures(e.point, {layers});
  const wma = hits.find(h => h.layer.id === "wma-fill");
  const parcel = hits.find(h => h.layer.id === "ours-fill") || hits.find(h => h.layer.id === "parcels-fill");
  if (!wma && !parcel){ if (popup) popup.remove(); setSelection(null); return; }
  let html = '<div class="pop">', selFeature = null;
  if (parcel){
    const p = parcel.properties;
    const ours = ourParcels().includes(p.ParcelID);

/* ================= MODES ================= */
let mode = null;          // null | pin | line | measure | track | extend
let extendTarget = null, extendAtStart = false;   // the line being extended, and which end
let draft = [];
function setMode(m){
  mode = m; draft = (m === "track" && track) ? track.pts : []; updateDraft();
  document.body.classList.toggle("moding", !!m);
  document.querySelectorAll("#toolbar button").forEach(b => { b.classList.toggle("on", b.dataset.tool === m); b.classList.toggle("rec", b.dataset.tool === "track" && !!track); });
  $("#crosshair").style.display = m === "pin" ? "block" : "none";
  map.getCanvas().style.cursor = (m === "line" || m === "measure" || m === "extend") ? "crosshair" : "";
  if (popup) popup.remove();
  renderActionBar();
}
function updateDraft(){
  if (!map.getSource("draft")) return;
  const feats = draft.map(c => ({type:"Feature", properties:{}, geometry:{type:"Point", coordinates:c}}));
  if (mode === "extend" && extendTarget && draft.length){
    const c = extendTarget.coords;
    const join = extendAtStart ? [c[0]].concat(draft) : [c[c.length - 1]].concat(draft);
    feats.push({type:"Feature", properties:{}, geometry:{type:"LineString", coordinates:join}});
  } else if (draft.length > 1) feats.push({type:"Feature", properties:{}, geometry:{type:"LineString", coordinates:draft}});
  map.getSource("draft").setData({type:"FeatureCollection", features:feats});
  renderActionBar();
}
function renderActionBar(){
  const bar = $("#actionbar");
  if (!mode){ bar.style.display = "none"; return; }
  bar.style.display = "flex";
  const len = draft.length > 1 ? fmtDist(pathLen(draft)) : "—";
  if (mode === "pin"){
    bar.innerHTML = `<div class="msg">Move the map so the <b>crosshair</b> is on the spot, or use your GPS.</div>
      <button class="btn primary" data-act="pin-here">Pin crosshair</button><button class="btn" data-act="pin-gps">📡 My GPS</button><button class="btn" data-act="cancel">Cancel</button>`;
  } else if (mode === "line"){
    bar.innerHTML = `<div class="msg">Tap the map to trace the line · <b>${draft.length}</b> pts · <b>${len}</b></div>
      <button class="btn" data-act="undo">Undo</button><button class="btn primary" data-act="line-done" ${draft.length<2?"disabled":""}>Finish</button><button class="btn" data-act="cancel">Cancel</button>`;
  } else if (mode === "extend"){
    const c = extendTarget ? extendTarget.coords : [];
    const total = extendTarget ? fmtDist(pathLen(c) + (draft.length ? pathLen((extendAtStart ? [c[0]] : [c[c.length-1]]).concat(draft)) : 0)) : "—";
    bar.innerHTML = `<div class="msg">✏️ Extending <b>${esc((extendTarget && extendTarget.name) || "line")}</b> · tap along the road, starting near either end · <b>${draft.length}</b> new pts · <b>${total}</b></div>
      <button class="btn" data-act="undo">Undo</button><button class="btn primary" data-act="extend-done" ${draft.length<1?"disabled":""}>Done</button><button class="btn" data-act="cancel">Cancel</button>`;
  } else if (mode === "track"){
    const mins = track ? Math.round((Date.now() - track.start)/60000) : 0;
    const dur = mins >= 60 ? Math.floor(mins/60) + " h " + (mins%60) + " min" : mins + " min";
    bar.innerHTML = `<div class="msg">🔴 <b>Recording</b> · <b>${len}</b> · ${dur} · ${draft.length} pts<br>Keep the screen on and this app open while walking.</div>
      <button class="btn primary" data-act="track-stop">Stop &amp; save</button><button class="btn danger" data-act="track-discard">Discard</button><button class="btn" data-act="track-center">Center</button>`;
  } else if (mode === "measure"){
    bar.innerHTML = `<div class="msg">Tap points to measure · <b>${len}</b>${myPos && draft.length===1 ? " · from you: <b>"+fmtDist(haversine(myPos, draft[0]))+"</b>" : ""}</div>
      <button class="btn" data-act="undo">Undo</button><button class="btn" data-act="clear">Clear</button><button class="btn primary" data-act="cancel">Done</button>`;
  }
}

/* ================= GO & TRACK ================= */
let watchId = null, wakeLock = null, trackTimer = null;
async function keepAwake(){ try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch(e){} }
function releaseAwake(){ try { if (wakeLock) wakeLock.release(); } catch(e){} wakeLock = null; }
function onTrackPos(p){
  if (!track) return;
  const c = [p.coords.longitude, p.coords.latitude];
  myPos = c;
  if (p.coords.accuracy && p.coords.accuracy > 40) return;          // skip poor fixes
  const last = track.pts[track.pts.length - 1];
  if (last && haversine(last, c) < 4) return;                        // ignore jitter under ~13 ft
  track.pts.push(c); LS.set("hm_track", track);
  if (mode === "track") updateDraft();
}
function watchTrack(){
  if (!navigator.geolocation){ toast("GPS not available"); return false; }
  if (watchId == null) watchId = navigator.geolocation.watchPosition(onTrackPos, err => toast("GPS: " + err.message, 3500), {enableHighAccuracy:true, maximumAge:0, timeout:30000});
  keepAwake();
  clearInterval(trackTimer); trackTimer = setInterval(() => { if (mode === "track") renderActionBar(); }, 30000);
  return true;
}
function startTrack(){
  if (track){ setMode("track"); return; }
  track = {pts:[], start:Date.now()}; LS.set("hm_track", track);
  if (!watchTrack()){ track = null; LS.set("hm_track", null); return; }
  setMode("track"); toast("Recording your path");
  try { geo.trigger(); } catch(e){}
}
function resumeTrack(){ watchTrack(); setMode("track"); toast("Still recording your track"); }
function endTrack(){
  if (watchId != null) navigator.geolocation.clearWatch(watchId);
  watchId = null; clearInterval(trackTimer); releaseAwake();
  const t = track; track = null; LS.set("hm_track", null);
  setMode(null);
  return t;
}
document.addEventListener("visibilitychange", () => { if (track && document.visibilityState === "visible") keepAwake(); });

/* ================= IMPORT / EXPORT ================= */
function download(name, text, mime){
  const blob = new Blob([text], {type:mime});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function exportGeoJSON(){
  const fc = {type:"FeatureCollection", features: liveMarks().map(m => ({type:"Feature",
    properties:{id:m.id, kind:m.kind, type:m.type, name:m.name||"", notes:m.notes||"", by:m.by||"", created:m.created||null, updated:m.updated||null, private:!!m.private},
    geometry: m.kind==="point" ? {type:"Point", coordinates:m.coords} : {type:"LineString", coordinates:m.coords}}))};
  download("hunt-marks-"+new Date().toISOString().slice(0,10)+".geojson", JSON.stringify(fc, null, 1), "application/geo+json");
}
function exportGPX(){
  const x = s => esc(s);
  const pts = liveMarks().filter(m=>m.kind==="point").map(m => `<wpt lat="${m.coords[1]}" lon="${m.coords[0]}"><name>${x(m.name || typeInfo(m.type).label)}</name><desc>${x(m.notes||"")}</desc><type>${x(typeInfo(m.type).label)}</type></wpt>`).join("\n");
  const trks = liveMarks().filter(m=>m.kind==="line").map(m => `<trk><name>${x(m.name || typeInfo(m.type).label)}</name><desc>${x(m.notes||"")}</desc><type>${x(typeInfo(m.type).label)}</type><trkseg>${m.coords.map(c=>`<trkpt lat="${c[1]}" lon="${c[0]}"/>`).join("")}</trkseg></trk>`).join("\n");

function guessType(label, kind){

}
async function importFile(file){

  const add = m => { if (!m.coords) return; if (!m.id || getMark(m.id)) m.id = uid(); m.created = m.created || Date.now(); upsertMark(m); n++; };
  try {
    if (/\.gpx$/i.test(file.name) || text.trim().startsWith("<")){
      const doc = new DOMParser().parseFromString(text, "application/xml");
      const g = (el, tag) => { const t = el.getElementsByTagName(tag)[0]; return t ? t.textContent : ""; };
      [...doc.getElementsByTagName("wpt")].forEach(w => add({kind:"point", type:guessType(g(w,"type")+" "+g(w,"sym")+" "+g(w,"name"),"point"), name:g(w,"name"), notes:g(w,"desc"), coords:[+w.getAttribute("lon"), +w.getAttribute("lat")]}));

        const pts = [...t.getElementsByTagName("trkpt"), ...t.getElementsByTagName("rtept")].map(p => [+p.getAttribute("lon"), +p.getAttribute("lat")]);
        if (pts.length > 1) add({kind:"line", type:guessType(g(t,"type")+" "+g(t,"name"),"line"), name:g(t,"name"), notes:g(t,"desc"), coords:pts});
      });
    } else {
      const j = JSON.parse(text);
      (j.features || []).forEach(f => {
        const p = f.properties || {}, geom = f.geometry || {};
        const priv = p.private === true;
        if (geom.type === "Point") add({id:p.id, private:priv, kind:"point", type:POINT_TYPES.some(t=>t.id===p.type) ? p.type : guessType(p.type||p.name,"point"), name:p.name||"", notes:p.notes||p.description||"", by:p.by||"", created:p.created, coords:geom.coordinates.slice(0,2)});
        else if (geom.type === "LineString") add({id:p.id, private:priv, kind:"line", type:LINE_TYPES.some(t=>t.id===p.type) ? p.type : guessType(p.type||p.name,"line"), name:p.name||"", notes:p.notes||p.description||"", by:p.by||"", created:p.created, coords:geom.coordinates.map(c=>c.slice(0,2))});
      });
    }
    closeSheet(); toast("Imported " + n + " mark" + (n===1?"":"s"));
  } catch(e){ toast("Couldn't read that file"); console.warn(e); }
}

// fetch with a time limit, so a request frozen while the app was in the background can't hang sync forever
async function fetchT(url, opts, ms = 20000){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try { return await fetch(url, Object.assign({}, opts, {signal: ctl.signal})); } finally { clearTimeout(t); }
}

}
function storeSession(j){

          email: (j.user && j.user.email) || (auth && auth.email) || settings.email || "", family: auth ? auth.family : undefined};

let refreshing = null;
async function accessToken(){

      .finally(() => { refreshing = null; });

/* ================= SYNC (shared marks only — private marks never leave the phone) ================= */
async function sb(path, opts){
  opts = opts || {};
  const token = await accessToken();
  if (!token) throw new Error("not signed in");
  const headers = Object.assign({apikey: settings.key, Authorization: "Bearer " + token, "Content-Type":"application/json"}, opts.headers || {});
  const r = await fetchT(sbBase() + "/rest/v1/" + path, Object.assign({}, opts, {headers}));
  if (!r.ok){ let t = ""; try{ t = (await r.json()).message || ""; }catch(e){} const err = new Error("HTTP " + r.status + (t ? " – " + t : "")); err.status = r.status; throw err; }
  if (r.status === 204) return null;
  const txt = await r.text(); return txt ? JSON.parse(txt) : null;
}
let syncing = false;
async function syncNow(manual){
  if (!syncOn() || syncing) return;
  syncing = true; updateSyncChip("Syncing…");
  try {
    if (auth.family !== true){
      const ok = await sb("rpc/is_family", {method:"POST", body:"{}"});
      if (!auth) return;
      auth.family = ok === true; saveAuth();
      if (!auth.family){ syncError = "not on family list"; if (manual) toast("Your email isn't on the family list yet", 4000); return; }
    }
    if (dirty.size){
      const ids = [...dirty];
      const rows = ids.map(id => marks[id]).filter(m => m && !m.private).map(m => ({id:m.id, data:m, updated:m.updated||Date.now(), deleted:!!m.deleted}));
      if (rows.length) await sb("marks?on_conflict=id", {method:"POST", headers:{Prefer:"resolution=merge-duplicates,return=minimal"}, body:JSON.stringify(rows)});
      ids.forEach(id => dirty.delete(id)); saveDirty();
    }
    const remote = await sb("marks?select=id,data,updated&limit=5000");
    let changed = false, needPush = false;
    const seen = new Set();
    (remote || []).forEach(r => {
      seen.add(r.id);
      const loc = marks[r.id];
      if (dirty.has(r.id) || privateMarks[r.id]) return;
      if (!loc || (r.updated || 0) > (loc.updated || 0)){ marks[r.id] = r.data; changed = true; }
      // This phone has a newer edit or deletion than the server (it never got through): send it again
      else if ((loc.updated || 0) > (r.updated || 0)){ dirty.add(r.id); needPush = true; }
    });
    // Shared marks this phone has that the server has never seen: send them too
    Object.keys(marks).forEach(id => { if (!seen.has(id) && !dirty.has(id)){ dirty.add(id); needPush = true; } });
    if (changed){ saveMarks(); renderMarks(); }
    if (needPush){ saveDirty(); syncSoon(); }
    lastSync = Date.now(); syncError = "";
    if (manual) toast("Synced ✔");
  } catch(e){
    if (e.status === 401 || e.status === 403){ if (auth) { auth.family = undefined; saveAuth(); } }
    syncError = e.message || "network error"; console.warn("sync", e);
    if (manual) toast("Sync failed: " + syncError, 4000);
  } finally { syncing = false; updateSyncChip(); }
}

async function refreshOtherGroups(){

    if (id === groups.active) continue;
    const g = LS.get("hm_g_" + id, null);
    if (!g || !g.auth || !g.settings || !g.settings.url || !g.settings.key) continue;
    const base = g.settings.url.replace(/\/+$/,""), H = {apikey: g.settings.key, "Content-Type":"application/json"};
    try {
      if (Date.now() > g.auth.expires_at - 120000){
        const r = await fetchT(base + "/auth/v1/token?grant_type=refresh_token", {method:"POST", headers:H, body:JSON.stringify({refresh_token:g.auth.refresh_token})});
        if (!r.ok){ if (r.status === 400 || r.status === 401) { g.auth = null; LS.set("hm_g_" + id, g); } continue; }
        const j = await r.json();
        g.auth = Object.assign({}, g.auth, {access_token:j.access_token, refresh_token:j.refresh_token, expires_at: Date.now() + (j.expires_in||3600)*1000});
      }
      const r = await fetchT(base + "/rest/v1/marks?select=id,data,updated&limit=5000", {headers: Object.assign({Authorization:"Bearer " + g.auth.access_token}, H)});
      if (!r.ok) continue;
      const rows = await r.json(), skip = new Set(g.dirty || []);
      g.marks = g.marks || {};

    } catch(e){ console.warn("group refresh", id, e); }
  }
}

const WX_URL = "https://api.open-meteo.com/v1/forecast";

const wxArrow = (fromDeg, size) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="transform:rotate(${(fromDeg + 180) % 360}deg)"><path d="M12 2 L19 10 H14.5 V22 H9.5 V10 H5 Z" fill="#fff"/></svg>`;

function wxSpot(){
  const b = settings.homeBounds;
  if (b && b[0] && b[1]) return [(b[0][0] + b[1][0]) / 2, (b[0][1] + b[1][1]) / 2];
  const c = map.getCenter(); return [c.lng, c.lat];
}
let wx = LS.get("hm_wx", null);
async function loadWeather(force){
  const [lng, lat] = wxSpot();
  const near = wx && Math.abs(wx.lat - lat) < 0.03 && Math.abs(wx.lng - lng) < 0.03;
  if (!force && near && Date.now() - wx.at < 30 * 60000){ renderWxChip(); return; }
  if (!navigator.onLine){ renderWxChip(); return; }
  const q = new URLSearchParams({latitude: lat.toFixed(4), longitude: lng.toFixed(4),
    current: "temperature_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m",

    daily: "sunrise,sunset", wind_speed_unit: "mph", temperature_unit: "fahrenheit",
    timezone: "America/New_York", forecast_days: "2"});

function renderWxChip(){
  const c = $("#wxChip");
  if (!wx || !wx.data || !wx.data.current){ c.style.display = "none"; return; }
  const cur = wx.data.current;
  c.innerHTML = `<span class="wxArrow">${wxArrow(cur.wind_direction_10m, 13)}</span>${compass(cur.wind_direction_10m)} ${Math.round(cur.wind_speed_10m)}<small>mph</small>`;

function openWeather(){
  if (!wx || !wx.data){ toast("No weather yet. Needs signal once."); return; }

  // Legal shooting hours: half an hour before sunrise to half an hour after sunset
  let day = 0;
  if (now > new Date(d.daily.sunset[0]).getTime() + 30 * 60000 && d.daily.sunset[1]) day = 1;
  const rise = new Date(d.daily.sunrise[day]), set = new Date(d.daily.sunset[day]);
  const start = new Date(rise.getTime() - 30 * 60000), end = new Date(set.getTime() + 30 * 60000);
  let i0 = h.time.findIndex(t => new Date(t).getTime() > now - 3600000); if (i0 < 0) i0 = 0;
  const rows = [];
  for (let i = i0; i < h.time.length && rows.length < 6; i += 2){
    const t = new Date(h.time[i]);
    rows.push(`<div class="wxRow"><span>${t.toLocaleTimeString([], {hour:"numeric"})}</span><span><span class="wxArrow" style="width:18px;height:18px;vertical-align:middle">${wxArrow(h.wind_direction_10m[i], 11)}</span> ${compass(h.wind_direction_10m[i])} ${Math.round(h.wind_speed_10m[i])} mph</span><span>${Math.round(h.temperature_2m[i])}°</span><span>${h.precipitation_probability[i] ?? 0}%</span></div>`);
  }
  const old = now - wx.at > 2 * 3600000;
  const rain = h.precipitation_probability[i0] ?? 0;
  openSheet(`<h2>Weather</h2>
    <div class="wxNow"><span class="wxArrow big">${wxArrow(cur.wind_direction_10m, 26)}</span><div><b>${compass(cur.wind_direction_10m)} ${Math.round(cur.wind_speed_10m)} mph</b> <span class="muted">gusts ${Math.round(cur.wind_gusts_10m)}</span><br><span class="muted">${Math.round(cur.temperature_2m)}°F · ${rain}% rain · blowing toward the ${compass(cur.wind_direction_10m + 180)}</span></div></div>
    <div class="wxLegal">Legal shooting hours ${day ? "tomorrow" : "today"}: <b>${wxTime(start)} – ${wxTime(end)}</b><br><span class="muted">Sunrise ${wxTime(rise)} · Sunset ${wxTime(set)}</span></div>
    ${rows.join("")}
    <p class="muted" style="margin:10px 0 0">Open-Meteo forecast · updated ${new Date(wx.at).toLocaleString([], {weekday:"short", hour:"numeric", minute:"2-digit"})}${old ? " · <b>saved copy, may be out of date</b>" : ""}. Check DWR regulations for season-specific hours.</p>
    <div class="row"><button class="btn" data-act="sheet-cancel">Close</button></div>`);
  loadWeather(false);
}

    case "track-stop": {
      const t = endTrack();
      if (!t || t.pts.length < 2){ toast("Track too short to save"); break; }
      const mins = Math.round((Date.now() - t.start)/60000);
      openMarkForm({id:uid(), kind:"line", type:"track", coords:t.pts.slice(), name:"Track " + fmtDate(t.start), notes:mins + " min walk"});
      break;
    }
    case "track-discard":
      if (el.dataset.confirm !== "1"){ el.dataset.confirm = "1"; el.textContent = "Tap again to discard"; break; }
      endTrack(); toast("Track discarded"); break;
    case "track-center": if (myPos) map.easeTo({center:myPos, zoom:Math.max(map.getZoom(), 16)}); else toast("Waiting for GPS…"); break;
    case "mark-save": saveMarkForm(); break;
    case "sheet-cancel": editing = null; closeSheet(); break;
    case "edit": if (popup) popup.remove(); openMarkForm(JSON.parse(JSON.stringify(getMark(id)))); break;
    case "del":
      if (el.dataset.confirm !== "1"){ el.dataset.confirm = "1"; el.textContent = "Tap again to delete"; break; }
      if (popup) popup.remove(); closeSheet(); deleteMark(id); toast("Deleted"); break;
    case "goto": gotoMark(id); break;
    case "exp-gpx": exportGPX(); break;
    case "exp-json": exportGeoJSON(); break;
    case "import": $("#importFile").click(); break;
    case "home": closeSheet(); goHome(); break;
    case "set-save": {
      settings.name = $("#sName").value.trim();
      if ($("#sGroup") && $("#sGroup").value.trim()){ activeGroup().label = $("#sGroup").value.trim(); saveGroups(); $("#title").textContent = "🦌 " + activeGroup().label; }
      const newParcels = $("#sParcels").value.split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean);
      if (newParcels.join("|") !== ourParcels().join("|")){ settings.parcels = newParcels; settings.homeBounds = null; saveSettings(); loadOurs(true); }
      const newUrl = $("#sUrl").value.trim(), newKey = $("#sKey").value.trim();
      if (newUrl !== settings.url || newKey !== settings.key){ settings.url = newUrl; settings.key = newKey; auth = null; saveAuth(); }
      saveSettings();
      closeSheet(); updateSyncChip(); toast("Saved"); syncNow(false);
      break;
    }
    case "send-link": {
      const email = ($("#sEmail").value || "").trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast("Enter a valid email"); break; }
      el.disabled = true; el.textContent = "Sending…";
      try {
        await sendLink(email); settings.email = email; settings.linkSentTo = email; saveSettings();
        const n = $("#linkNote"); n.innerHTML = "📧 Link sent to <b>" + esc(email) + "</b>. Open the email <b>on this phone</b> and tap the link — RoCo Hunt opens signed in. Can take a minute; check spam." + (IS_IOS && IS_STANDALONE ? " On iPhone the link opens in Safari: tap <b>Copy sign-in for home-screen app</b> there, then come back and tap <b>Paste sign-in from Safari</b>." : ""); n.style.display = "block";
        el.textContent = "Send a new link";
      } catch(err){ toast(/rate|too many|seconds/i.test(err.message) ? "Too many emails right now — wait a bit and try again" : "Couldn't send link: " + err.message, 5000); el.textContent = "Email me a sign-in link"; }
      el.disabled = false;
      break;
    }
    case "send-code": {
      const email = ($("#sEmail").value || "").trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast("Enter a valid email"); break; }
      el.disabled = true; el.textContent = "Sending…";
      try { await sendCode(email); settings.email = email; settings.codeSentTo = email; saveSettings(); $("#codeBox").style.display = "block"; toast("Code sent to " + email, 3500); el.textContent = "Send a new code"; }
      catch(err){ toast("Couldn't send code: " + err.message, 5000); el.textContent = "Email me a code"; }
      el.disabled = false;
      break;
    }
    case "verify-code": {
      const email = settings.codeSentTo || ($("#sEmail").value || "").trim().toLowerCase();
      const code = ($("#sCode").value || "").replace(/\D/g, "");
      if (code.length < 6){ toast("Enter the code from the email"); break; }
      el.disabled = true; el.textContent = "Signing in…";
      try { await verifyCode(email, code); settings.codeSentTo = ""; saveSettings(); closeSheet(); toast("Signed in ✔"); await syncNow(true); }
      catch(err){ toast("Sign-in failed: " + err.message, 5000); el.disabled = false; el.textContent = "Sign in"; }
      break;
    }
    case "sign-out": {
      if (el.dataset.confirm !== "1"){ el.dataset.confirm = "1"; el.textContent = "Tap again to sign out"; break; }
      await signOut(); closeSheet(); toast("Signed out. Private marks stay on this phone.");
      break;
    }
    case "sync-now": closeSheet(); syncNow(true); break;
    case "xfer-copy": {
      const link = transferLink();
      try {
        await navigator.clipboard.writeText(link);
        // Hand the sign-in over: Safari stops using it so the two never fight over the same session
        auth = null; saveAuth(); updateSyncChip();
        openSheet(`<h2>📋 Copied</h2><p>Now open <b>RoCo Hunt from your Home Screen</b>, tap <b>⚙️</b>, then <b>📋 Paste sign-in from Safari</b>.</p><p class="muted">Safari has handed its sign-in to the app.</p><div class="row"><button class="btn" data-act="sheet-cancel">Close</button></div>`);
      } catch(err){
        $("#sheet").insertAdjacentHTML("beforeend", `<label>Couldn't copy automatically. Press and hold this box, Select All, Copy:</label><textarea readonly>${esc(link)}</textarea>`);
      }
      break;
    }
    case "paste-clip": {
      let txt = "";
      try { txt = await navigator.clipboard.readText(); } catch(e){}
      if (!/#setup=|access_token=|\/auth\/v1\/verify/.test(txt || "")){
        toast("Nothing to paste yet. In Safari, tap Copy sign-in for home-screen app first.", 6000); break;
      }
      $("#sPaste").value = txt;
    }
    // falls through to use the pasted link
    case "paste-link": {
      const txt = ($("#sPaste").value || "").trim();
      const found = txt.match(/https?:\/\/\S+/);
      let u; try { u = new URL(found ? found[0] : txt); } catch(e){ toast("That doesn't look like a link"); break; }
      if (/^#setup=/.test(u.hash) || /[#&]access_token=/.test(u.hash)){ closeSheet(); location.hash = u.hash; break; }   // the page reloads and applies it
      if (/\/auth\/v1\/verify$/.test(u.pathname) && u.searchParams.get("token")){
        // Sign-in email link: only ever sent to a sync project already set up on this phone
        const base = u.origin;
        const gid = groupIdForUrl(base);
        const key = normUrl(settings.url) === base ? settings.key : (gid ? (((LS.get("hm_g_" + gid, {}) || {}).settings) || {}).key : "");
        if (!key){ toast("That sign-in link is for a group not set up on this phone. Paste its setup link first.", 6000); break; }
        el.disabled = true; el.textContent = "Signing in…";
        try {
          const r = await fetchT(base + "/auth/v1/verify", {method:"POST", headers:{apikey:key, "Content-Type":"application/json"},
            body: JSON.stringify({type: u.searchParams.get("type") || "magiclink", token_hash: u.searchParams.get("token")})});
          let j = {}; try { j = await r.json(); } catch(e){}
          if (!r.ok || !j.access_token) throw new Error(j.msg || j.error_description || j.message || ("HTTP " + r.status));
          closeSheet();
          location.hash = "access_token=" + encodeURIComponent(j.access_token) + "&refresh_token=" + encodeURIComponent(j.refresh_token) + "&expires_in=" + (j.expires_in || 3600);
        } catch(err){
          toast("That sign-in link didn't work (" + err.message + "). Request a new one and copy it without tapping it.", 7000);
          el.disabled = false; el.textContent = "Use link";
        }
        break;
      }
      toast("That isn't a RoCo Hunt setup or sign-in link", 4000);
      break;
    }
    case "grp-switch": {
      if (track){ toast("Finish or stop your GPS track before switching groups", 4000); break; }
      if (mode){ toast("Finish what you're drawing first", 3500); break; }
      activateGroup(el.dataset.id); location.reload(); break;
    }
    case "grp-remove": {
      if (el.dataset.confirm !== "1"){ el.dataset.confirm = "1"; el.textContent = "Tap again to remove"; break; }
      localStorage.removeItem("hm_g_" + el.dataset.id); delete groups.list[el.dataset.id]; saveGroups();
      closeSheet(); toast("Group removed from this phone"); if (groupCount() === 1) $("#title").textContent = "🦌 RoCo Hunt";
      break;
    }
    case "copy-link": {
      const cfg = {p: ourParcels()};
      if (groupCount() > 1) cfg.n = activeGroup().label;
      if (sbConfigured()){ cfg.u = settings.url; cfg.k = settings.key; }
      const payload = encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(cfg)))));
      const link = location.origin + location.pathname + "#setup=" + payload;
      try { await navigator.clipboard.writeText(link); toast("Setup link copied — text it to family"); }
      catch(err){ $("#sheet").insertAdjacentHTML("beforeend", `<label>Copy this link:</label><textarea readonly>${esc(link)}</textarea>`); }
      break;
    }
  }
});
})();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
