# Keeps the free Supabase sync projects from pausing for inactivity.
# Twice a week it calls a harmless "ping" function in each project (no data is read).
# About once a month it also adds a tiny heartbeat commit, because GitHub turns off
# scheduled jobs in repos with no activity for 60 days.
name: Keep sync awake

on:
  schedule:
    - cron: "23 14 * * 1,4"   # Mondays and Thursdays, ~9:23 AM Eastern
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping each sync project
        env:
          TARGETS: ${{ secrets.KEEPALIVE_TARGETS }}
        run: |
          fail=0
          for t in $TARGETS; do
            ref="${t%%|*}"; key="${t#*|}"
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -X POST \
              "https://$ref.supabase.co/rest/v1/rpc/ping" \
              -H "apikey: $key" -H "Content-Type: application/json" -d '{}')
            echo "project ${ref:0:4}…: HTTP $code"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail

      - uses: actions/checkout@v4

      - name: Monthly heartbeat commit
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( now - last )) -gt $(( 40 * 86400 )) ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "Keep-alive heartbeat"
            git push
          else
            echo "Recent activity; no heartbeat needed."
          fi
